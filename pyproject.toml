[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writ-retrieval-system"
version = "0.1.0"
description = "Connected context for agents, extracted from Writ and adapted to Relate"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["relate-db==1.0.1"]

[project.scripts]
writ-retrieval = "writ_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
