name: Bake-off evidence reports
on:
  pull_request:
    paths:
      - 'experiments/db_offload/summarize_evidence.py'
      - 'experiments/db_offload/report-request.json'
      - '.github/workflows/bakeoff-report.yml'
permissions:
  contents: write
jobs:
  report:
    if: github.head_ref == 'codex/bakeoff-evaluation-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.5.4 matplotlib==3.10.8
      - name: Read persisted raw evidence, without rerunning experiments
        run: |
          git fetch origin codex/bakeoff-evidence-43540148638
          git checkout FETCH_HEAD -- experiments/db_offload/evidence/recovered-ci/43540148638
          python -m experiments.db_offload.summarize_evidence --root experiments/db_offload/evidence/recovered-ci/43540148638
      - name: Persist reports on a separate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "codex/bakeoff-reports-$GITHUB_RUN_ID"
          git add experiments/db_offload/evidence/recovered-ci/43540148638
          git diff --cached --quiet || git commit -m "Summarize persisted bake-off evidence $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/codex/bakeoff-reports-$GITHUB_RUN_ID"
