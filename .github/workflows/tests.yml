name: Retrieval baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --no-cache-dir --no-binary=hnswlib -c requirements-validated.txt -e '.[dev]'
        env:
          CC: gcc
          CXX: g++
          HNSWLIB_NO_NATIVE: '1'
      - run: python -m pip check
      - run: python scripts/offline_run.py -m pytest -q
      - run: python scripts/offline_run.py -m unittest discover -s tests -v
