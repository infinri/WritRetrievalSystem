[package]
name = "writ-relate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Connected decision/evidence context for coding agents, stored and searched in embedded Relate"
publish = false

[[bin]]
name = "writ-relate"
path = "src/main.rs"

[dependencies]
relate = { version = "=1.0.1" }
tract-onnx = "=0.21.13"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
